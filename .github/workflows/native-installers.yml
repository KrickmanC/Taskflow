name: Native Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  linux-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build deb package
        run: bash tools/install/linux/build-deb.sh

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-linux-deb
          path: dist/*.deb

  windows-exe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Inno Setup installer
        shell: powershell
        run: |
          choco install innosetup -y
          .\tools\install\windows\build-exe.ps1

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-windows-exe
          path: tools/install/windows/dist/*.exe
